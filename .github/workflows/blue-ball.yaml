name: Blue Ball

on:
  pull_request:
    branches: [main, "epic/**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
