name: Blue Ball

on:
  pull_request:
    branches: [main, "epic/**"]

concurrency:
  group: blue-ball-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx biome ci .
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    container:
      # Tag MUST match the exact @playwright/test version in package.json (same as e2e/Dockerfile).
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v7
      - run: npm ci --ignore-scripts
      - run: npx playwright test --config e2e/playwright.config.ts
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
